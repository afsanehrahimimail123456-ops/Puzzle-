<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معماهای شبکه منطقی | پاسخ‌نامه و حل تعاملی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #1e293b;
            --accent: #2563eb;
            --border: #cbd5e1;
            --yes-bg: #dcfce7;
            --yes-color: #15803d;
            --no-bg: #fee2e2;
            --no-color: #b91c1c;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            padding-bottom: 50px;
        }

        /* هدر و معرفی کتاب */
        header {
            background-color: var(--primary);
            color: #ffffff;
            padding: 24px 16px;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .container {
            max-width: 800px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* نوار انتخاب شماره معما */
        .puzzle-selector {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .puzzle-selector label {
            font-weight: 700;
            font-size: 0.95rem;
        }

        select {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            background-color: #f1f5f9;
            color: var(--text-main);
            cursor: pointer;
            min-width: 200px;
        }

        /* کارت اصلی معما */
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .puzzle-badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .puzzle-title {
            font-size: 1.35rem;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .puzzle-story {
            background: #f8fafc;
            padding: 14px;
            border-right: 4px solid var(--accent);
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 0.95rem;
        }

        .clues-title {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .clues-list {
            padding-right: 20px;
            margin-bottom: 20px;
        }

        .clues-list li {
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        /* راهنمای ابزار جدول */
        .grid-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grid-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-reset {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-reset:hover {
            background: #e2e8f0;
        }

        /* جدول شبکه منطقی تعاملی */
        .grid-wrapper {
            overflow-x: auto;
            margin-bottom: 10px;
        }

        table.logic-grid {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
            user-select: none;
        }

        table.logic-grid th, table.logic-grid td {
            border: 1px solid #94a3b8;
            padding: 10px 8px;
        }

        table.logic-grid th {
            background-color: #f1f5f9;
            font-weight: 700;
            color: var(--primary);
        }

        table.logic-grid th.group-header {
            background-color: #e2e8f0;
            font-size: 0.95rem;
        }

        td.cell {
            width: 48px;
            height: 44px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background-color 0.15s;
        }

        td.cell:hover {
            background-color: #f8fafc;
        }

        td.cell[data-state="no"] {
            background-color: var(--no-bg);
            color: var(--no-color);
        }

        td.cell[data-state="yes"] {
            background-color: var(--yes-bg);
            color: var(--yes-color);
        }

        /* بخش پاسخ‌نامه */
        .answer-section {
            margin-top: 24px;
            border-top: 1px dashed var(--border);
            padding-top: 20px;
        }

        .btn-toggle-answer {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-toggle-answer:hover {
            background-color: #1d4ed8;
        }

        .answer-box {
            display: none;
            margin-top: 16px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 10px;
            padding: 18px;
        }

        .answer-box.visible {
            display: block;
        }

        .answer-box h3 {
            color: #166534;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .solution-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        .solution-table th, .solution-table td {
            border: 1px solid #bbf7d0;
            padding: 8px 12px;
            text-align: right;
            font-size: 0.9rem;
        }

        .solution-table th {
            background: #dcfce7;
            color: #14532d;
        }

        .explanation {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #1e293b;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>کتاب «معماهای شبکه منطقی»</h1>
    <p>فضای حل تعاملی و پاسخ‌نامه رسمی کتاب</p>
</header>

<div class="container">
    <!-- انتخابگر معما -->
    <div class="puzzle-selector">
        <label for="puzzleSelect">انتخاب شماره معما:</label>
        <select id="puzzleSelect" onchange="changePuzzle(this.value)"></select>
    </div>

    <!-- محتوای معما -->
    <div class="card">
        <span class="puzzle-badge" id="puzzleLevel">سطح: مقدماتی</span>
        <h2 class="puzzle-title" id="puzzleTitle">عنوان معما</h2>
        <p class="puzzle-story" id="puzzleStory">متن داستان معما...</p>

        <div class="clues-title">سرنخ‌ها:</div>
        <ul class="clues-list" id="cluesList"></ul>

        <!-- جدول تعاملی -->
        <div class="grid-controls">
            <span class="grid-hint">💡 روی هر خانه کلیک کنید: ۱ بار (✗) | ۲ بار (✓) | ۳ بار (پاک شدن)</span>
            <button class="btn-reset" onclick="resetGrid()">پاک کردن جدول</button>
        </div>

        <div class="grid-wrapper">
            <table class="logic-grid" id="logicGrid"></table>
        </div>

        <!-- دکمه نمایش پاسخ -->
        <div class="answer-section">
            <button class="btn-toggle-answer" id="toggleAnswerBtn" onclick="toggleAnswer()">
                مشاهده پاسخ نهایی و روش حل
            </button>
            <div class="answer-box" id="answerBox">
                <h3>پاسخ صحیح معما:</h3>
                <table class="solution-table" id="solutionTable"></table>
                <div class="explanation" id="explanationText"></div>
            </div>
        </div>
    </div>
</div>

<footer>
    © تمامی حقوق متعلق به کتاب «معماهای شبکه منطقی» است.
</footer>

<script>
    // ==========================================
    // بانک اطلاعاتی معماها (این بخش را می‌توانید به تعداد صفحات کتاب گسترش دهید)
    // ==========================================
    const puzzlesData = {
        "1": {
            title: "معمای شماره ۱: سفارش نوشیدنی در کافه",
            level: "سطح: آسان",
            story: "سه دوست به نام‌های آرش، بهرام و کیوان به کافه رفته‌اند. هر کدام یک نوشیدنی متفاوت (قهوه، چای، آب‌میوه) سفارش داده و در یکی از میزهای ۱، ۲ یا ۳ نشسته‌اند.",
            clues: [
                "آرش قهوه سفارش نداده است.",
                "کسی که در میز شماره ۲ نشسته، چای سفارش داده است.",
                "کیوان در میز شماره ۱ نشسته است.",
                "بهرام چای نمی‌نوشد."
            ],
            rowCategory: "افراد",
            rows: ["آرش", "بهرام", "کیوان"],
            colGroups: [
                { name: "نوشیدنی", items: ["قهوه", "چای", "آب‌میوه"] },
                { name: "شماره میز", items: ["میز ۱", "میز ۲", "میز ۳"] }
            ],
            solutionHeaders: ["نام فرد", "نوشیدنی", "شماره میز"],
            solutionRows: [
                ["آرش", "چای", "میز ۲"],
                ["بهرام", "قهوه", "میز ۳"],
                ["کیوان", "آب‌میوه", "میز ۱"]
            ],
            explanation: "طبق سرنخ ۲ و ۴، بهرام چای نمی‌نوشد و کیوان هم در میز ۱ است (سرنخ ۳) پس کیوان هم چای ندارد؛ بنابراین آرش چای سفارش داده و در میز ۲ نشسته است. از آنجا که آرش قهوه ندارد (سرنخ ۱) و کیوان چای/قهوه را با توجه به حذف گزینه‌ها ندارد، بهرام قهوه را در میز ۳ و کیوان آب‌میوه را در میز ۱ سفارش داده‌اند."
        },
        "2": {
            title: "معمای شماره ۲: مسابقه کتاب‌خوانی",
            level: "سطح: متوسط",
            story: "سه دانش‌آموز (سارا، مریم، نگین) در یک ماه اخیر تعداد متفاوتی کتاب (۳، ۵ و ۷ جلد) در ژانرهای مختلف (تاریخی، علمی، داستان) مطالعه کرده‌اند.",
            clues: [
                "سارا کتاب‌های تاریخی نخوانده است.",
                "کسی که ۷ جلد کتاب خوانده، به ژانر علمی علاقه دارد.",
                "مریم ۵ جلد کتاب مطالعه کرده است.",
                "نگین کتاب‌های تاریخی را انتخاب کرده است."
            ],
            rowCategory: "دانش‌آموزان",
            rows: ["سارا", "مریم", "نگین"],
            colGroups: [
                { name: "تعداد کتاب", items: ["۳ جلد", "۵ جلد", "۷ جلد"] },
                { name: "ژانر کتاب", items: ["تاریخی", "علمی", "داستان"] }
            ],
            solutionHeaders: ["دانش‌آموز", "تعداد کتاب", "ژانر"],
            solutionRows: [
                ["سارا", "۷ جلد", "علمی"],
                ["مریم", "۵ جلد", "داستان"],
                ["نگین", "۳ جلد", "تاریخی"]
            ],
            explanation: "مریم ۵ جلد خوانده (سرنخ ۳) و نگین تاریخی خوانده (سرنخ ۴). طبق سرنخ ۲، خواننده ۷ جلد کتاب علمی خوانده است؛ چون مریم ۵ جلد خوانده و نگین تاریخی خوانده، پس سارا ۷ جلد کتاب علمی خوانده است. در نتیجه نگین ۳ جلد تاریخی و مریم ۵ جلد داستان خوانده است."
        }
    };

    let currentPuzzleId = "1";

    // خواندن پارامتر URL برای لینک مستقیم QR Code (مثلاً ?p=2)
    function getPuzzleIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        const p = params.get("p");
        return (p && puzzlesData[p]) ? p : "1";
    }

    // پر کردن منوی کشویی معماها
    function initSelector() {
        const select = document.getElementById("puzzleSelect");
        select.innerHTML = "";
        for (const id in puzzlesData) {
            const option = document.createElement("option");
            option.value = id;
            option.textContent = puzzlesData[id].title;
            select.appendChild(option);
        }
    }

    // تغییر معما و به‌روزرسانی آدرس مرورگر
    function changePuzzle(id) {
        currentPuzzleId = id;
        const url = new URL(window.location);
        url.searchParams.set("p", id);
        window.history.pushState({}, "", url);
        renderPuzzle(id);
    }

    // نمایش اطلاعات معما و ساخت جدول تعاملی
    function renderPuzzle(id) {
        const data = puzzlesData[id];
        document.getElementById("puzzleSelect").value = id;
        document.getElementById("puzzleLevel").textContent = data.level;
        document.getElementById("puzzleTitle").textContent = data.title;
        document.getElementById("puzzleStory").textContent = data.story;

        // سرنخ‌ها
        const cluesList = document.getElementById("cluesList");
        cluesList.innerHTML = "";
        data.clues.forEach(clue => {
            const li = document.createElement("li");
            li.textContent = clue;
            cluesList.appendChild(li);
        });

        // ساخت جدول منطقی
        const table = document.getElementById("logicGrid");
        table.innerHTML = "";

        // ردیف هدر گروه‌ها
        const groupRow = document.createElement("tr");
        const cornerTh = document.createElement("th");
        cornerTh.rowSpan = 2;
        cornerTh.textContent = data.rowCategory;
        groupRow.appendChild(cornerTh);

        data.colGroups.forEach(group => {
            const th = document.createElement("th");
            th.colSpan = group.items.length;
            th.className = "group-header";
            th.textContent = group.name;
            groupRow.appendChild(th);
        });
        table.appendChild(groupRow);

        // ردیف هدر آیتم‌ها
        const itemsRow = document.createElement("tr");
        let totalCols = 0;
        data.colGroups.forEach(group => {
            group.items.forEach(item => {
                const th = document.createElement("th");
                th.textContent = item;
                itemsRow.appendChild(th);
                totalCols++;
            });
        });
        table.appendChild(itemsRow);

        // ردیف‌های قابل کلیک
        data.rows.forEach(rowName => {
            const tr = document.createElement("tr");
            const rowTh = document.createElement("th");
            rowTh.textContent = rowName;
            tr.appendChild(rowTh);

            for (let i = 0; i < totalCols; i++) {
                const td = document.createElement("td");
                td.className = "cell";
                td.dataset.state = "empty";
                td.onclick = function () {
                    cycleCellState(this);
                };
                tr.appendChild(td);
            }
            table.appendChild(tr);
        });

        // مخفی کردن پاسخ‌نامه هنگام تغییر معما
        const answerBox = document.getElementById("answerBox");
        answerBox.classList.remove("visible");
        document.getElementById("toggleAnswerBtn").textContent = "مشاهده پاسخ نهایی و روش حل";

        // پر کردن جدول پاسخ‌نامه
        const solTable = document.getElementById("solutionTable");
        solTable.innerHTML = "";
        const solHeadRow = document.createElement("tr");
        data.solutionHeaders.forEach(h => {
            const th = document.createElement("th");
            th.textContent = h;
            solHeadRow.appendChild(th);
        });
        solTable.appendChild(solHeadRow);

        data.solutionRows.forEach(r => {
            const tr = document.createElement("tr");
            r.forEach(val => {
                const td = document.createElement("td");
                td.textContent = val;
                tr.appendChild(td);
            });
            solTable.appendChild(tr);
        });

        document.getElementById("explanationText").textContent = "تحلیل منطقی: " + data.explanation;
    }

    // تغییر وضعیت خانه‌های جدول (خالی -> ضربدر -> تیک)
    function cycleCellState(cell) {
        const current = cell.dataset.state;
        if (current === "empty") {
            cell.dataset.state = "no";
            cell.textContent = "✗";
        } else if (current === "no") {
            cell.dataset.state = "yes";
            cell.textContent = "✓";
        } else {
            cell.dataset.state = "empty";
            cell.textContent = "";
        }
    }

    function resetGrid() {
        document.querySelectorAll("td.cell").forEach(cell => {
            cell.dataset.state = "empty";
            cell.textContent = "";
        });
    }

    function toggleAnswer() {
        const box = document.getElementById("answerBox");
        const btn = document.getElementById("toggleAnswerBtn");
        box.classList.toggle("visible");
        btn.textContent = box.classList.contains("visible")
            ? "پنهان کردن پاسخ‌نامه"
            : "مشاهده پاسخ نهایی و روش حل";
    }

    // اجرای اولیه
    initSelector();
    currentPuzzleId = getPuzzleIdFromURL();
    renderPuzzle(currentPuzzleId);
</script>

</body>
</html>
